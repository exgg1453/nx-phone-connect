name: NXPhoneConnect
options:
  bundleIdPrefix: com.nxteam
  deploymentTarget:
    iOS: "15.0"
targets:
  NXPhoneConnect:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: NX Phone Connect
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: NX Phone Connect uses the local network to find and connect to your other devices.
        NSBonjourServices:
          - _nxconnect._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nxteam.nxconnect
        PRODUCT_NAME: NXPhoneConnect
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  NXPhoneConnect:
    build:
      targets:
        NXPhoneConnect: all
